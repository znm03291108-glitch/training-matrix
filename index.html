<body>
<header><div class="wrap"><h1>XCMG 培训矩阵系统 V2 保留数据修正版</h1><div class="sub">人员 × 培训内容 × 时间 / 状态；支持新增、修改、删除、导出和本地保存</div></div></header>
<div class="wrap">
  <div class="cards">
    <div class="card"><b id="pCount">0</b><span>人员数量</span></div>
    <div class="card"><b id="tCount">0</b><span>培训项目</span></div>
    <div class="card"><b id="rCount">0</b><span>培训记录</span></div>
    <div class="card"><b id="doneCount">0</b><span>已参加</span></div>
    <div class="card"><b id="planCount">0</b><span>待参加</span></div>
    <div class="card"><b id="saveState">已保存</b><span>保存状态</span></div>
  </div>
  <div class="panel">
    <div class="notice">说明：这版可直接编辑，数据默认保存在当前浏览器本地。换手机/清缓存会丢失，所以修改后建议点击“导出备份JSON”。</div>
    <div class="filters">
      <div><label>搜索人员 / 岗位 / 培训内容</label><input id="q" placeholder="输入姓名、岗位、培训项目..." oninput="render()"></div>
      <div><label>团队</label><select id="team" onchange="render()"><option value="">全部团队</option></select></div>
      <div><label>培训项目</label><select id="training" onchange="render()"><option value="">全部培训</option></select></div>
      <div><label>状态</label><select id="status" onchange="render()"><option value="">全部状态</option><option>已参加</option><option>已预约/待参加</option><option>异常/未完成</option><option>有记录</option><option>未安排</option></select></div>
      <button onclick="openPersonModal()">新增人员</button>
      <button class="btn2" onclick="openRecordModal()">新增培训记录</button>
      <button class="btn3" onclick="openTrainingModal()">新增培训项目</button>
    </div>
    <div class="topBtns">
      <button class="btn2" onclick="exportCSV()">导出CSV</button>
      <button class="btn2" onclick="exportJSON()">导出备份JSON</button>
      <button class="btn4" onclick="document.getElementById('importFile').click()">导入备份JSON</button><input id="importFile" type="file" accept=".json" class="hidden" onchange="importJSON(event)">
      <button class="btn3" onclick="window.print()">打印</button>
      <button class="btnDanger" onclick="resetOriginal()">恢复原始数据</button>
    </div>
    <div class="legend"><span class="tag done">已参加</span><span class="tag plan">已预约/待参加</span><span class="tag risk">异常/未完成</span><span class="tag record">有记录</span><span class="tag empty">未安排</span></div>
  </div>
  <div class="panel">
    <div class="tabs"><button class="tab active" onclick="switchView('matrix',this)">矩阵视图</button><button class="tab" onclick="switchView('list',this)">明细视图</button><button class="tab" onclick="switchView('person',this)">按人员汇总</button><button class="tab" onclick="switchView('manage',this)">数据管理</button></div>
    <div id="matrixView"><div class="tablebox"><table id="matrixTable"></table></div></div>
    <div id="listView" class="hidden"></div>
    <div id="personView" class="hidden"></div>
    <div id="manageView" class="hidden"></div>
  </div>
</div>

<div id="modalMask" class="modalMask"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button onclick="saveModal()">保存</button><button class="btnLight" onclick="closeModal()">取消</button></div></div></div>

function saveModal(){if(modalMode==='person')savePerson(); else if(modalMode==='training')saveTraining(); else if(modalMode==='record')saveRecord(); closeModal(); saveData(); render();}
function savePerson(){const obj={id:editingId||uid('person'),no:val('m_no'),name:val('m_name'),position:val('m_position'),team:val('m_team'),movement:val('m_movement'),trade:val('m_trade'),sap:val('m_sap')}; if(!obj.name){alert('请填写姓名'); return;} const i=DATA.people.findIndex(x=>x.id===obj.id); if(i>=0){DATA.people[i]={...DATA.people[i],...obj}; DATA.records.forEach(r=>{if(r.personId===obj.id){r.name=obj.name;r.position=obj.position;r.team=obj.team;}});} else DATA.people.push(obj);}
function saveTraining(){const old=editingId, name=val('m_training'); if(!name){alert('请填写培训项目'); return;} if(old){const i=DATA.trainings.indexOf(old); if(i>=0)DATA.trainings[i]=name; DATA.records.forEach(r=>{if(r.training===old)r.training=name;});} else if(!DATA.trainings.includes(name)) DATA.trainings.push(name);}
function saveRecord(){const pid=val('m_person'); const p=DATA.people.find(x=>x.id===pid); const obj={id:editingId||uid('record'),personId:pid,team:p?.team||'',name:p?.name||'',position:p?.position||'',training:val('m_training_rec'),status:val('m_status'),time:val('m_time'),note:val('m_note')}; const i=DATA.records.findIndex(x=>x.id===obj.id); if(i>=0)DATA.records[i]=obj; else DATA.records.push(obj);}
function val(id){return document.getElementById(id).value.trim();}
function deleteRecord(id){if(!confirm('确定删除这条培训记录吗？'))return; DATA.records=DATA.records.filter(x=>x.id!==id); saveData(); render();}
function deletePerson(id){if(!confirm('删除人员会同时删除此人的培训记录，确定吗？'))return; DATA.people=DATA.people.filter(x=>x.id!==id); DATA.records=DATA.records.filter(x=>x.personId!==id); saveData(); render();}
function deleteTraining(name){if(!confirm('删除培训项目会同时删除相关培训记录，确定吗？'))return; DATA.trainings=DATA.trainings.filter(x=>x!==name); DATA.records=DATA.records.filter(x=>x.training!==name); saveData(); render();}
function exportCSV(){const headers=['团队','姓名','岗位','培训项目','状态','时间','备注']; const rows=DATA.records.map(r=>[r.team,r.name,r.position,r.training,r.status,r.time,r.note]); const csv='﻿'+[headers,...rows].map(row=>row.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n'); download(new Blob([csv],{type:'text/csv;charset=utf-8;'}),'培训矩阵记录.csv');}
function exportJSON(){download(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),'培训矩阵备份.json');}
function importJSON(e){const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const d=JSON.parse(reader.result); if(!d.people||!d.trainings||!d.records)throw new Error('格式不对'); DATA=d; saveData(); render(); alert('导入成功');}catch(err){alert('导入失败：JSON格式不正确');}}; reader.readAsText(file); e.target.value='';}
function download(blob,name){const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);}
function resetOriginal(){if(!confirm('确定恢复到最初Excel生成的数据吗？当前修改会被覆盖。'))return; DATA=clone(ORIGINAL_DATA); saveData(); render();}
render();
</script>
</body>
